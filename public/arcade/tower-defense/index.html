<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense - Board Game Online</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/arcade/tower-defense/runtime/graphics/sprites.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #080810; color: #d0d8f0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    #toolbar { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 12px; background: linear-gradient(90deg, #0d0d18, #111827); border-bottom: 1px solid #1e2030; box-shadow: 0 8px 24px rgba(0,0,0,0.24); }
    #toolbar a { color: #8a90a8; text-decoration: none; }
    #toolbar .title { font-weight: 800; letter-spacing: 0; }
    #toolbar .sep { flex: 1; }
    .runtime-note { color: #8a90a8; font-size: 0.78rem; white-space: nowrap; }
    #toolbar button, .btn-small { background: rgba(255,255,255,0.06); border: 1px solid #1e2030; border-radius: 6px; color: #d0d8f0; padding: 4px 10px; cursor: pointer; min-height: 32px; }
    #toolbar button:hover, .btn-small:hover { background: rgba(255,255,255,0.1); }
    #toolbar .primary { background: linear-gradient(135deg, #27ae60, #1e8449); border-color: rgba(125, 206, 160, 0.5); color: #fff; font-weight: 800; }
    #toolbar .danger { background: linear-gradient(135deg, rgba(231,76,60,0.32), rgba(142,68,173,0.24)); border-color: rgba(231,76,60,0.55); color: #ffd6d6; font-weight: 800; }
    .tower-quick { display: flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(0,0,0,0.18); }
    .tower-quick button { padding: 4px 8px; min-width: 44px; }
    .tower-quick button.active { background: rgba(52,152,219,0.26); border-color: rgba(93,173,226,0.7); box-shadow: 0 0 0 1px rgba(93,173,226,0.25) inset; }
    #main { display: flex; height: calc(100vh - 48px); }
    #game-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #050508; overflow: hidden; }
    #game-canvas { display: block; max-width: 100%; max-height: 100%; cursor: crosshair; }
    #td-modal-overlay { display: none; position: absolute; inset: 0; z-index: 40; }
    #editor-panel { width: 320px; min-width: 320px; background: #0d0d18; border-left: 1px solid #1e2030; display: flex; flex-direction: column; overflow: hidden; }
    #tab-bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid #1e2030; background: #0a0a14; }
    .tab-btn { background: none; border: 1px solid transparent; border-radius: 6px 6px 0 0; color: #8a90a8; padding: 4px 8px; cursor: pointer; font-size: 0.72rem; }
    .tab-btn.active { background: #0d0d18; border-color: #1e2030; color: #d0d8f0; }
    #tab-content { flex: 1; overflow-y: auto; padding: 8px; }
    .tab-section h3 { font-size: 0.78rem; text-transform: uppercase; color: #8a90a8; margin: 10px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #1e2030; }
    .field-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .field-row label, .field-row > span:first-child { min-width: 90px; max-width: 90px; color: #8a90a8; font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-row input[type=range] { flex: 1; accent-color: #3498db; min-width: 0; }
    .field-row input[type=number], .field-row input[type=text], .field-row select { background: #11111e; border: 1px solid #1e2030; border-radius: 4px; color: #d0d8f0; padding: 2px 4px; font-size: 0.78rem; }
    .stage-block, .enemy-block, .passive-block { background: rgba(255,255,255,0.03); border: 1px solid #1e2030; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
    .stage-header, .enemy-header, .passive-header { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .stage-name, .enemy-name, .passive-name { flex: 1; font-weight: 700; }
    #unsaved-dot { display: none; color: #f39c12; }
    #panel-toggle { display: none; }
    @media (max-width: 768px) {
      #main { flex-direction: column; }
      #toolbar { flex-wrap: wrap; align-content: center; gap: 6px; }
      .runtime-note { display: none; }
      #main { height: calc(100vh - 92px); }
      #game-canvas-wrap { height: calc(100vh - 92px - 48px); }
      #editor-panel { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 60vh; transform: translateY(100%); transition: transform 0.3s ease; z-index: 30; border-left: none; border-top: 1px solid #1e2030; }
      #editor-panel.panel-open { transform: translateY(0); }
      #panel-toggle { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 48px; align-items: center; justify-content: center; background: #0d0d18; border-top: 1px solid #1e2030; z-index: 25; font-weight: 700; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <a class="back-link" href="/">Back</a>
    <span class="title">Tower Defense</span>
    <span id="unsaved-dot">*</span>
    <button class="primary" data-action="play-stage">Play Stage 1</button>
    <button data-action="start-wave">Start Wave</button>
    <div class="tower-quick" aria-label="Tower quick build">
      <button data-place-type="cannon" title="Cannon">C</button>
      <button data-place-type="frost" title="Frost">F</button>
      <button data-place-type="tesla" title="Tesla">T</button>
      <button data-place-type="amplifier" title="Amplifier">A</button>
    </div>
    <button class="danger" data-action="meteor">Meteor</button>
    <span class="sep"></span>
    <button data-action="import">Import</button>
    <button data-action="export">Export</button>
    <button data-action="publish">Publish</button>
    <span id="publish-status" class="runtime-note"></span>
    <span class="runtime-note">Sandbox: npm run sandbox</span>
  </div>
  <div id="main">
    <div id="game-canvas-wrap">
      <canvas id="game-canvas" width="800" height="600"></canvas>
      <div id="td-modal-overlay"></div>
    </div>
    <div id="editor-panel"></div>
  </div>
  <div id="panel-toggle">Editor Panel</div>

  <script src="/arcade/tower-defense/runtime/graphics/theme.js?v=1.1"></script>
  <script src="/arcade/tower-defense/runtime/config.js?v=1.1"></script>
  <script src="/js/sandbox-config.js?v=1.1"></script>
  <script>
    if (window.SandboxConfigBridge && window.TD_CONFIG) {
      var loadedPublished = window.SandboxConfigBridge.load('td_published_config', window.TD_CONFIG);
      var loadedDraft = !loadedPublished && window.SandboxConfigBridge.load('sandbox_td_config', window.TD_CONFIG);
      var statusEl = document.getElementById('publish-status');
      if (statusEl) statusEl.textContent = loadedPublished ? 'Published config loaded' : (loadedDraft ? 'Draft config loaded' : 'Default config');
    }
    document.getElementById('panel-toggle').addEventListener('click', function () {
      document.getElementById('editor-panel').classList.toggle('panel-open');
    });
  </script>
  <script src="/arcade/tower-defense/runtime/game.js?v=1.2"></script>
  <script src="/arcade/tower-defense/runtime/ui.js?v=1.2"></script>
  <script>
    TDGame.init(document.getElementById('game-canvas'));
    TDUI.init();
  </script>
  <script src="/js/sw-update.js?v=20260819a"></script>
</body>
</html>
