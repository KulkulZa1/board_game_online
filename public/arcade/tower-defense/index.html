<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>첨탑 대란 — 타워 디펜스 로그라이트</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
  <div id="container">
    <header id="hdr">
      <a href="/" class="back-btn">← 로비</a>
      <span class="game-title">🗼 첨탑 대란</span>
      <div id="hdrStats">
        <span title="최고 웨이브">🏆 <strong id="bestDisp">0</strong></span>
        <button id="speedBtn" class="hdr-btn" title="배속">1×</button>
        <button id="muteBtn" class="hdr-btn" title="음소거">🔊</button>
      </div>
    </header>

    <div id="statBar">
      <div class="stat wave">웨이브 <b id="waveDisp">0</b></div>
      <div class="stat lives">생명 <b id="livesDisp">10</b></div>
      <div class="stat gold">금 <b id="goldDisp">100</b></div>
    </div>

    <div id="previewBar">📜 다음 웨이브: <b id="previewText">—</b></div>
    <div id="modBar"></div>

    <div id="boardWrap"><canvas id="c"></canvas></div>

    <button id="waveBtn">⚔ 웨이브 시작</button>

    <div id="buildMenu">
      <div id="buildTitle">타워 건설</div>
      <div id="buildBtns"></div>
    </div>

    <!-- 드래프트 모달 -->
    <div id="draftModal" class="modal hidden">
      <div class="modal-box">
        <div class="pick-title">🃏 전리품 — 하나를 고르세요</div>
        <div id="draftCards"></div>
        <button id="draftSkip" class="skip-btn">건너뛰고 +10 금</button>
      </div>
    </div>

    <!-- 메타 상점 -->
    <div id="metaModal" class="modal hidden">
      <div class="modal-box">
        <div class="pick-title">🔮 마나핵 연구 <span id="coresDisp"></span><span class="spacer"></span><button id="metaClose" class="modal-close">✕</button></div>
        <div id="metaList"></div>
      </div>
    </div>

    <!-- 시작/종료 오버레이 -->
    <div id="overlay" class="overlay visible">
      <div class="ov-box">
        <div class="ov-icon" id="ovIcon">🗼</div>
        <h2 id="ovTitle">첨탑 대란</h2>
        <p class="ov-msg" id="ovMsg">길이 아닌 칸을 눌러 <b>타워를 짓고</b>, 웨이브를 버텨내세요.
          웨이브를 깰 때마다 <b>전리품 카드</b>를 골라 빌드를 만듭니다.
          같은 타워 <b>Lv3 둘을 붙여 놓으면 ⚡융합</b> — 하나를 제물로 진화합니다.
          <b>5의 배수 웨이브</b>엔 군주가 옵니다. 다음 웨이브 예고를 보고 배치를 계획하세요.
          지더라도 <b>🔮 마나핵</b>은 남습니다 — 영구 연구로 더 멀리.</p>
        <div id="bestLine" class="best-line"></div>
        <button id="startBtn">🛡 방어 시작</button>
        <button id="metaBtn">🔮 마나핵 연구</button>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="/js/admob.js?v=1.0"></script>
  <script src="sim.js?v=1.0"></script>
  <script src="game.js?v=1.0"></script>
  <script src="/js/sw-update.js?v=20260819a"></script>
</body>
</html>
