<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>뱀파이어 서바이버 — 보드게임 온라인</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=4.5">
</head>
<body>
  <div id="container">
    <header id="hdr">
      <a href="/" class="back-btn">← 로비</a>
      <span class="game-title">👾 뱀파이어 서바이버</span>
      <div id="hdr-stats">
        <span>Lv.<strong id="lvDisp">1</strong></span>
        <span>⏱<strong id="timeDisp">0:00</strong></span>
        <span>💀<strong id="killDisp">0</strong></span>
        <button id="guideBtn" class="guide-btn" title="조합 가이드 (H키)">📖</button>
      </div>
    </header>

    <div id="gameWrapper">
      <canvas id="c" tabindex="0"></canvas>

      <!-- 플로팅 조이스틱 — 캔버스 아무 곳이나 터치하면 그 자리에 나타난다 -->
      <div id="joystickBase"><div id="joystickKnob"></div></div>

      <!-- 모바일 액션 버튼(터치 기기 전용) — 엄지가 닿는 우하단 -->
      <div id="mobileActions">
        <div class="tower-cluster">
          <button id="mobTowerCycle" class="mob-btn mob-cycle" title="타워 종류 변경 (Y)">↻</button>
          <button id="mobTowerBtn" class="mob-btn mob-tower" title="타워 설치 (T)">🗼</button>
        </div>
        <button id="odBtn" class="mob-btn mob-od" title="오버드라이브 (Q)"><span id="odBtnLabel">0%</span></button>
      </div>

      <!-- 레벨업 / 아이템 선택 오버레이 -->
      <div id="levelOverlay" style="display:none;">
        <div id="levelBox">
          <div id="levelTitle">⬆ 레벨 업!</div>
          <div id="levelHint" class="level-hint">숫자키 1 · 2 · 3 으로 선택</div>
          <div id="upgradeList"></div>
        </div>
      </div>

      <!-- 조합 가이드 모달 -->
      <div id="comboGuide" style="display:none;">
        <div id="comboBox">
          <div class="combo-header">
            <span>📖 조합 가이드</span>
            <button id="comboClose" class="combo-close">✕</button>
          </div>
          <div id="comboContent"></div>
        </div>
      </div>

      <!-- 무한 웨이브 다이얼로그 -->
      <div id="infiniteDialog" style="display:none;">
        <div id="infiniteDialogBox">
          <div class="infinite-icon">🌀</div>
          <div class="infinite-title">10분 생존 완료!</div>
          <div class="infinite-sub">무한 웨이브를 계속하시겠습니까?<br><span class="infinite-warn">경고: 극도로 어려워집니다</span></div>
          <div class="infinite-btns">
            <button id="infiniteYesBtn" class="infinite-btn-yes">⚔ 계속 싸운다</button>
            <button id="infiniteNoBtn" class="infinite-btn-no">🏆 승리로 마무리</button>
          </div>
        </div>
      </div>

      <!-- 시작/게임오버 오버레이 -->
      <div id="overlay" class="visible">
        <div id="overlayBox">
          <div id="overlayIcon">👾</div>
          <p id="overlayMsg">생존하며 적을 처치하세요!<br>WASD / 방향키 또는 조이스틱</p>
          <label id="stageSelectWrap" style="display:none;margin:10px 0;color:#ddd;font-size:0.85rem;">
            Stage
            <select id="stageSelect" style="margin-left:6px;background:#111827;color:#fff;border:1px solid #39445a;border-radius:6px;padding:4px 8px;"></select>
          </label>
          <p id="overlaySub"></p>
          <button id="startBtn">시작하기</button>
        </div>
      </div>
    </div>

    <!-- 체력 바 -->
    <div id="hpBar">
      <span>❤</span>
      <div id="hpTrack"><div id="hpFill"></div></div>
      <span id="hpText">100/100</span>
    </div>

    <!-- XP 바 -->
    <div id="xpBar">
      <span id="xpLabel">Lv.1</span>
      <div id="xpTrack"><div id="xpFill"></div></div>
      <span id="xpText">0/30</span>
    </div>

    <!-- 무기 슬롯 -->
    <div id="weaponSlots"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admob.js?v=1.0"></script>
  <script src="/js/sandbox-config.js?v=1.1"></script>
  <script>
    // 샌드박스 설정은 ?sandbox 파라미터가 있을 때만 적용 (일반 플레이 시 localStorage 오염 방지)
    if (window.SandboxConfigBridge && new URLSearchParams(window.location.search).has('sandbox')) {
      window.VS_CONFIG = window.SandboxConfigBridge.read('sandbox_vs_config');
    }
  </script>
  <script src="vps-equipment.js?v=1.5"></script>
  <script src="game.js?v=4.5"></script>
  <script src="/js/sw-update.js?v=20260607b"></script>
</body>
</html>
