<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BANG! — 보드게임 온라인</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/games/bang.css?v=1.1">
</head>
<body>
  <div id="container">
    <header id="hdr">
      <a href="/" class="back-btn">← 로비</a>
      <span class="game-title">🤠 BANG!</span>
      <div id="hdrRight">
        <button id="muteBtn" title="소리 켜기/끄기">🔊</button>
        <span id="roomChip" class="hidden"></span>
      </div>
    </header>

    <!-- 게임 화면 -->
    <main id="table" class="hidden">
      <!-- 원탁: 상대 좌석은 좌표로 배치, 거리선/카드 애니메이션 레이어 포함 -->
      <div id="tableWrap">
        <div id="feltBg"></div>
        <svg id="rangeSvg"></svg>
        <div id="playersGrid"></div>
        <div id="centerPile">
          <div class="pile-group" id="deckPile">
            <span class="pile-shadow s2"></span><span class="pile-shadow s1"></span>
            <div class="card mini back"></div>
            <b id="deckCount">0</b>
          </div>
          <div class="pile-group" id="discardPile">
            <span class="pile-shadow s2"></span><span class="pile-shadow s1"></span>
            <div id="discardTop"></div>
          </div>
        </div>
        <div id="logStrip">
          <span id="logTicker"></span>
          <button id="logToggle" title="기록 보기">📜</button>
        </div>
        <div id="logDrawer" class="hidden"></div>
        <div id="flyLayer"></div>
      </div>

      <!-- 리액션/타겟 안내 -->
      <div id="promptBar" class="hidden"></div>
      <div id="reactArea" class="hidden"></div>

      <!-- 내 좌석 -->
      <div id="myPanel"></div>

      <!-- 내 손패 -->
      <div id="myHand"></div>

      <div id="myActions">
        <button id="endTurnBtn" class="hidden">턴 종료 ➤</button>
      </div>
    </main>

    <!-- 대기실 / 시작 오버레이 -->
    <div id="lobbyOverlay" class="overlay visible" aria-hidden="false">
      <div class="ov-box">
        <div class="ov-icon">🤠</div>
        <h2>BANG! <span class="sub">서부의 무법자 사냥 · 4~7인</span></h2>

        <div id="entryPane">
          <p class="ov-msg">숨겨진 역할 — <b>보안관·부관·무법자·배신자</b>.
            무법자는 보안관을 노리고, 보안관은 무법자를 색출합니다.
            빈 자리는 시작할 때 AI가 채웁니다.</p>
          <input id="nickInput" maxlength="12" placeholder="닉네임" autocomplete="off">
          <div class="size-row">
            <span>인원</span>
            <div id="sizeBtns">
              <button data-n="4">4</button><button data-n="5" class="on">5</button>
              <button data-n="6">6</button><button data-n="7">7</button>
            </div>
          </div>
          <div class="btn-row">
            <button id="createBtn" class="primary">🏠 방 만들기</button>
            <button id="soloBtn">🤖 AI들과 바로 시작</button>
          </div>
          <div class="join-row">
            <input id="codeInput" maxlength="6" placeholder="방 코드" autocomplete="off">
            <button id="joinBtn">참가</button>
          </div>
          <p id="entryError" class="err"></p>
        </div>

        <div id="waitPane" class="hidden">
          <p class="ov-msg">방 코드 <b id="waitCode" class="code"></b></p>
          <button id="copyLink" class="linkish">🔗 초대 링크 복사</button>
          <div id="seatList"></div>
          <button id="startBtn" class="primary hidden">▶ 시작 (빈 자리는 AI)</button>
          <p class="ov-msg dim" id="waitHint">방장이 시작하면 게임이 열립니다</p>
        </div>
      </div>
    </div>

    <!-- 최종 결과 -->
    <div id="overOverlay" class="overlay hidden">
      <div class="ov-box">
        <div class="ov-icon">🏆</div>
        <h2 id="overTitle">대결 종료</h2>
        <div id="roleReveal"></div>
        <div class="btn-row">
          <button id="againBtn" class="primary">🤠 새 대결</button>
          <a href="/" class="linkish" style="align-self:center">로비로</a>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/bang-client.js?v=1.2"></script>
  <script src="/js/sw-update.js?v=20260520b"></script>
</body>
</html>
