<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>리치 마작 — 보드게임 온라인</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/games/mahjong.css?v=1.0">
</head>
<body>
  <div id="container">
    <header id="hdr">
      <a href="/" class="back-btn">← 로비</a>
      <span class="game-title">🀄 리치 마작</span>
      <div id="hdrRight">
        <span id="roomChip" class="hidden"></span>
      </div>
    </header>

    <!-- 게임 화면 -->
    <main id="table" class="hidden">
      <!-- 상대 3인 (상가 · 대면 · 하가) -->
      <div id="oppRow">
        <div class="opp" data-rel="1"><div class="opp-head"><b class="opp-name"></b><span class="opp-wind"></span></div>
          <div class="opp-info"><span class="opp-score"></span><span class="opp-tiles"></span><span class="opp-riichi hidden">리치!</span></div>
          <div class="opp-melds"></div><div class="opp-river"></div></div>
        <div class="opp" data-rel="2"><div class="opp-head"><b class="opp-name"></b><span class="opp-wind"></span></div>
          <div class="opp-info"><span class="opp-score"></span><span class="opp-tiles"></span><span class="opp-riichi hidden">리치!</span></div>
          <div class="opp-melds"></div><div class="opp-river"></div></div>
        <div class="opp" data-rel="3"><div class="opp-head"><b class="opp-name"></b><span class="opp-wind"></span></div>
          <div class="opp-info"><span class="opp-score"></span><span class="opp-tiles"></span><span class="opp-riichi hidden">리치!</span></div>
          <div class="opp-melds"></div><div class="opp-river"></div></div>
      </div>

      <!-- 중앙 정보 -->
      <div id="centerBar">
        <span id="roundInfo">동1국</span>
        <span id="honbaInfo"></span>
        <span id="stickInfo"></span>
        <span id="wallInfo"></span>
        <div id="doraBox"><span class="dora-label">도라</span><span id="doraTiles"></span></div>
      </div>

      <!-- 내 강(버림패) -->
      <div id="myRiverWrap"><div id="myRiver"></div></div>

      <!-- 내 정보 + 액션 -->
      <div id="myBar">
        <div id="myInfo"><b id="myName"></b><span id="myWind"></span><span id="myScore"></span><span id="myRiichi" class="hidden">리치!</span></div>
        <div id="actionBar"></div>
      </div>

      <!-- 내 멜드 + 손패 -->
      <div id="myMelds"></div>
      <div id="myHand"></div>
      <div id="turnHint"></div>
    </main>

    <!-- 국 결과 모달 -->
    <div id="resultModal" class="modal hidden">
      <div class="modal-box" id="resultBox"></div>
    </div>

    <!-- 대기실 / 시작 오버레이 -->
    <div id="lobbyOverlay" class="overlay visible">
      <div class="ov-box">
        <div class="ov-icon">🀄</div>
        <h2>리치 마작 <span class="sub">동풍전 · 4인</span></h2>

        <div id="entryPane">
          <p class="ov-msg">친구를 초대하거나 AI와 함께 치세요.<br>빈 자리는 시작할 때 AI가 채웁니다.</p>
          <input id="nickInput" maxlength="12" placeholder="닉네임" autocomplete="off">
          <div class="btn-row">
            <button id="createBtn" class="primary">🏠 방 만들기</button>
            <button id="soloBtn">🤖 AI 3인과 바로 시작</button>
          </div>
          <div class="join-row">
            <input id="codeInput" maxlength="6" placeholder="방 코드" autocomplete="off">
            <button id="joinBtn">참가</button>
          </div>
          <p id="entryError" class="err"></p>
        </div>

        <div id="waitPane" class="hidden">
          <p class="ov-msg">방 코드 <b id="waitCode" class="code"></b></p>
          <button id="copyLink" class="linkish">🔗 초대 링크 복사</button>
          <div id="seatList"></div>
          <button id="startBtn" class="primary hidden">▶ 시작 (빈 자리는 AI)</button>
          <p class="ov-msg dim" id="waitHint">방장이 시작하면 게임이 열립니다</p>
        </div>
      </div>
    </div>

    <!-- 최종 결과 오버레이 -->
    <div id="overOverlay" class="overlay hidden">
      <div class="ov-box">
        <div class="ov-icon">🏆</div>
        <h2>대국 종료</h2>
        <div id="rankList"></div>
        <div class="btn-row">
          <button id="againBtn" class="primary">🀄 새 대국</button>
          <a href="/" class="linkish" style="align-self:center">로비로</a>
        </div>
      </div>
    </div>

    <!-- 토스트 -->
    <div id="toast" class="hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mahjong-client.js?v=1.0"></script>
</body>
</html>
